name: Package tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      atst_ref:
        description: ATST commit or refs/pull/N/merge for coordinated candidates
        default: '45d8c78de8a605c127cd4c36742d0c9525a0a6b6'
        type: string
      forge_ref:
        description: Forge commit or refs/pull/N/merge for coordinated candidates
        default: '43f5d4a274bb7106f1572dcaab122f7f29c7456b'
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            dependencies: minimum
          - python: '3.12'
            dependencies: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install 'build>=1.2' 'twine>=6' 'pytest>=8,<10'
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install 'ase==3.28.0' 'numpy==1.26.4' 'seekpath==2.2.1'
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Verify installed import and dependencies
        run: |
          python -m pip check
          python -c "import abacuslite, pathlib, sys; assert pathlib.Path(abacuslite.__file__).is_relative_to(pathlib.Path(sys.prefix))"
      - name: Run offline regressions
        run: python -m pytest -q
      - name: Rebuild wheel from sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
      - name: Validate the sdist-derived wheel
        run: |
          python -m pip install --force-reinstall --no-deps rebuilt/*.whl
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*

  installed-consumers:
    name: installed-consumers
    runs-on: ubuntu-latest
    needs: installed-package
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions-3.12
          path: candidate-dist
      - name: Checkout ATST consumer
        uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/atst-tools
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.atst_ref || '45d8c78de8a605c127cd4c36742d0c9525a0a6b6' }}
          path: consumer-sources/atst
          persist-credentials: false
      - name: Checkout Forge consumer
        uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/abacus-forge
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.forge_ref || '43f5d4a274bb7106f1572dcaab122f7f29c7456b' }}
          path: consumer-sources/forge
          persist-credentials: false
      - name: Install consumers and candidate wheel
        run: |
          python -m pip install 'pytest>=8,<10' ./consumer-sources/atst ./consumer-sources/forge candidate-dist/*.whl
          python -m pip check
          git -C consumer-sources/atst rev-parse HEAD
          git -C consumer-sources/forge rev-parse HEAD
      - name: Run consumer contracts outside checkouts
        run: |
          mkdir -p "$RUNNER_TEMP/abacuslite-consumers"
          cp -R tests "$RUNNER_TEMP/abacuslite-consumers/tests"
          cp pyproject.toml "$RUNNER_TEMP/abacuslite-consumers/pyproject.toml"
          cd "$RUNNER_TEMP/abacuslite-consumers"
          python -m pytest tests/consumers --run-consumers -q -s

  compatibility-gate:
    name: compatibility-gate
    if: always()
    needs: [installed-package, installed-consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility job to succeed
        env:
          PACKAGE_RESULT: ${{ needs.installed-package.result }}
          CONSUMER_RESULT: ${{ needs.installed-consumers.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$CONSUMER_RESULT" = success
