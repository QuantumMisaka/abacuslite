name: Package tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      atst_ref:
        description: ATST commit or refs/pull/N/merge for coordinated candidates
        default: '87caeedbca5ed7104316bfc6130fd2598b6c5e4b'
        type: string
      forge_ref:
        description: Forge commit or refs/pull/N/merge for coordinated candidates
        default: '43f5d4a274bb7106f1572dcaab122f7f29c7456b'
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            dependencies: minimum
          - python: '3.12'
            dependencies: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install 'build>=1.2' 'twine>=6' 'pytest>=8,<10'
      - name: Check release validation guards
        run: python -m pytest .github/tests -q
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install 'ase==3.28.0' 'numpy==1.26.0' 'seekpath==2.2.0' 'pytest==8.0.0'
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Stage offline tests outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-tests"
          cp -R tests examples "$RUNNER_TEMP/wheel-tests/"
          cp pyproject.toml "$RUNNER_TEMP/wheel-tests/"
      - name: Verify installed import and dependencies
        working-directory: ${{ runner.temp }}/wheel-tests
        run: |
          python -m pip check
          python -I -c "import abacuslite, pathlib, sys; print(abacuslite.__file__); assert pathlib.Path(abacuslite.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
      - name: Run offline regressions
        working-directory: ${{ runner.temp }}/wheel-tests
        run: python -I -m pytest -q
      - name: Rebuild wheel from sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
      - name: Validate the sdist-derived wheel
        run: |
          python -m pip install --force-reinstall --no-deps rebuilt/*.whl
          mkdir -p "$RUNNER_TEMP/sdist-tests"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-tests" --strip-components=1
          cd "$RUNNER_TEMP/sdist-tests"
          python -m pip check
          python -I -c "import abacuslite, pathlib, sys; print(abacuslite.__file__); assert pathlib.Path(abacuslite.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
          python -I -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*

  installed-consumers:
    name: installed-consumers (vendored vs external)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: installed-package
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions-3.12
          path: candidate-dist
      - name: Checkout ATST consumer
        uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/atst-tools
          ref: ${{ github.event_name == 'schedule' && 'integrate/abacuslite-1.1.0-acceptance' || inputs.atst_ref || '87caeedbca5ed7104316bfc6130fd2598b6c5e4b' }}
          path: consumer-sources/atst
          persist-credentials: false
      - name: Require the selected ATST consumer runner
        run: |
          git -C consumer-sources/atst rev-parse HEAD
          test -f consumer-sources/atst/scripts/run_abacuslite_consumer.py || {
            echo 'The selected ATST revision does not provide the installed consumer runner.' >&2
            exit 1
          }
      - name: Checkout Forge consumer
        uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/abacus-forge
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.forge_ref || '43f5d4a274bb7106f1572dcaab122f7f29c7456b' }}
          path: consumer-sources/forge
          persist-credentials: false
      - name: Build the selected ATST wheel
        run: |
          python -m pip install 'build>=1.2'
          python -m build --wheel --outdir "$RUNNER_TEMP/atst-dist" consumer-sources/atst
          git -C consumer-sources/atst rev-parse HEAD
          git -C consumer-sources/forge rev-parse HEAD
          sha256sum "$RUNNER_TEMP"/atst-dist/*.whl candidate-dist/*.whl
      - name: Install separate vendored and external consumer environments
        run: |
          python -m venv "$RUNNER_TEMP/consumer-vendored"
          python -m venv "$RUNNER_TEMP/consumer-external"
          atst_wheel=("$RUNNER_TEMP"/atst-dist/*.whl)
          "$RUNNER_TEMP/consumer-vendored/bin/python" -m pip install \
            "${atst_wheel[0]}[test]"
          "$RUNNER_TEMP/consumer-vendored/bin/python" -m pip freeze \
            > "$RUNNER_TEMP/consumer-base-freeze.txt"
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip install \
            -r "$RUNNER_TEMP/consumer-base-freeze.txt"
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip install \
            --no-deps candidate-dist/*.whl
          "$RUNNER_TEMP/consumer-vendored/bin/python" -m pip check
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip check
      - name: Compare ATST installed consumer suites
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer-vendored/bin/python" \
            "$GITHUB_WORKSPACE/consumer-sources/atst/scripts/run_abacuslite_consumer.py" \
            --atst-root "$GITHUB_WORKSPACE/consumer-sources/atst" \
            --backend vendored --report "$RUNNER_TEMP/vendored-consumer.json"
          "$RUNNER_TEMP/consumer-external/bin/python" \
            "$GITHUB_WORKSPACE/consumer-sources/atst/scripts/run_abacuslite_consumer.py" \
            --atst-root "$GITHUB_WORKSPACE/consumer-sources/atst" \
            --backend external --report "$RUNNER_TEMP/external-consumer.json"
          "$RUNNER_TEMP/consumer-external/bin/python" \
            "$GITHUB_WORKSPACE/consumer-sources/atst/scripts/run_abacuslite_consumer.py" \
            --compare "$RUNNER_TEMP/vendored-consumer.json" "$RUNNER_TEMP/external-consumer.json"
      - name: Install Forge after the paired ATST comparison
        run: |
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip install ./consumer-sources/forge
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip check
      - name: Run plugin-owned ATST and Forge contracts outside checkouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/abacuslite-consumers"
          cp -R tests "$RUNNER_TEMP/abacuslite-consumers/tests"
          cp pyproject.toml "$RUNNER_TEMP/abacuslite-consumers/pyproject.toml"
          cd "$RUNNER_TEMP/abacuslite-consumers"
          "$RUNNER_TEMP/consumer-external/bin/python" -m pytest tests/consumers \
            --run-consumers -q -s --junitxml="$RUNNER_TEMP/plugin-consumers.pytest.xml" \
            2>&1 | tee "$RUNNER_TEMP/plugin-consumers.pytest.log"
          python "$GITHUB_WORKSPACE/.github/scripts/check_consumer_results.py" \
            --junit "$RUNNER_TEMP/plugin-consumers.pytest.xml" \
            --expected "$GITHUB_WORKSPACE/.github/consumer-cases.json"
      - name: Upload consumer comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-consumer-comparison
          path: |
            ${{ runner.temp }}/vendored-consumer.json
            ${{ runner.temp }}/vendored-consumer.pytest.log
            ${{ runner.temp }}/vendored-consumer.pytest.xml
            ${{ runner.temp }}/external-consumer.json
            ${{ runner.temp }}/external-consumer.pytest.log
            ${{ runner.temp }}/external-consumer.pytest.xml
            ${{ runner.temp }}/consumer-base-freeze.txt
            ${{ runner.temp }}/plugin-consumers.pytest.log
            ${{ runner.temp }}/plugin-consumers.pytest.xml
          if-no-files-found: ignore

  compatibility-gate:
    name: compatibility-gate
    if: always()
    needs: [installed-package, installed-consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility job to succeed
        env:
          PACKAGE_RESULT: ${{ needs.installed-package.result }}
          CONSUMER_RESULT: ${{ needs.installed-consumers.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$CONSUMER_RESULT" = success
