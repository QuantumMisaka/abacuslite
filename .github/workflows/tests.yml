name: Package tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            dependencies: minimum
          - python: '3.12'
            dependencies: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install 'build>=1.2' 'twine>=6' 'pytest>=8,<10'
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install 'ase==3.28.0' 'numpy==1.26.4' 'seekpath==2.2.1'
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Verify installed import and dependencies
        run: |
          python -m pip check
          python -c "import abacuslite, pathlib, sys; assert pathlib.Path(abacuslite.__file__).is_relative_to(pathlib.Path(sys.prefix))"
      - name: Run offline regressions
        run: python -m pytest -q
      - name: Rebuild wheel from sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
      - name: Validate the sdist-derived wheel
        run: |
          python -m pip install --force-reinstall --no-deps rebuilt/*.whl
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*
