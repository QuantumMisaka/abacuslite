name: Package tests

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      atst_ref:
        description: ATST commit or refs/pull/N/merge for coordinated candidates
        default: '033bd15701c039016a858d5709e7d86855350b2e'
        type: string
      forge_ref:
        description: Forge commit or refs/pull/N/merge for coordinated candidates
        default: 'd8d1a74736ef0d8f1e5d4dab09662ceb370afaf5'
        type: string
      develop_ref:
        description: Optional develop engine ref for a coordinated candidate
        default: ''
        type: string
      lts_ref:
        description: Optional LTS engine ref for a coordinated candidate
        default: ''
        type: string
      harness_ref:
        description: Optional reviewed ABACUS harness ref
        default: ''
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            dependencies: minimum
          - python: '3.12'
            dependencies: current
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install 'build>=1.2' 'twine>=6' 'pytest>=8,<10'
      - name: Check release validation guards
        run: python -m pytest .github/tests -q
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install 'ase==3.28.0' 'numpy==1.26.0' 'seekpath==2.2.0' 'pytest==8.0.0'
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Stage offline tests outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-tests"
          cp -R tests examples "$RUNNER_TEMP/wheel-tests/"
          cp pyproject.toml "$RUNNER_TEMP/wheel-tests/"
      - name: Verify installed import and dependencies
        working-directory: ${{ runner.temp }}/wheel-tests
        run: |
          python -m pip check
          python -I -c "import abacuslite, pathlib, sys; print(abacuslite.__file__); assert pathlib.Path(abacuslite.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
      - name: Run offline regressions
        working-directory: ${{ runner.temp }}/wheel-tests
        run: python -I -m pytest -q
      - name: Rebuild wheel from sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
      - name: Validate the sdist-derived wheel
        run: |
          python -m pip install --force-reinstall --no-deps rebuilt/*.whl
          mkdir -p "$RUNNER_TEMP/sdist-tests"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-tests" --strip-components=1
          cd "$RUNNER_TEMP/sdist-tests"
          python -m pip check
          python -I -c "import abacuslite, pathlib, sys; print(abacuslite.__file__); assert pathlib.Path(abacuslite.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
          python -I -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*

  installed-consumers:
    name: installed-consumers (${{ matrix.python }}/${{ matrix.dependencies }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: installed-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            dependencies: minimum
          - python: '3.12'
            dependencies: current
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: candidate-dist
      - name: Checkout ATST consumer
        uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/atst-tools
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.atst_ref || '033bd15701c039016a858d5709e7d86855350b2e' }}
          path: consumer-sources/atst
          persist-credentials: false
      - name: Require the selected ATST consumer runner
        run: |
          git -C consumer-sources/atst rev-parse HEAD
          test -f consumer-sources/atst/scripts/run_abacuslite_consumer.py || {
            echo 'The selected ATST revision does not provide the installed consumer runner.' >&2
            exit 1
          }
      - name: Checkout Forge consumer
        uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/abacus-forge
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.forge_ref || 'd8d1a74736ef0d8f1e5d4dab09662ceb370afaf5' }}
          path: consumer-sources/forge
          persist-credentials: false
      - name: Build the selected ATST wheel
        run: |
          python -m pip install 'build>=1.2'
          python -m build --wheel --outdir "$RUNNER_TEMP/atst-dist" consumer-sources/atst
          git -C consumer-sources/atst rev-parse HEAD
          git -C consumer-sources/forge rev-parse HEAD
          sha256sum "$RUNNER_TEMP"/atst-dist/*.whl candidate-dist/*.whl
      - name: Install the external consumer environment
        env:
          DEPENDENCY_LANE: ${{ matrix.dependencies }}
        run: |
          python -m venv "$RUNNER_TEMP/consumer-external"
          : > "$RUNNER_TEMP/consumer-constraints.txt"
          if [ "$DEPENDENCY_LANE" = minimum ]; then
            printf '%s\n' 'ase==3.28.0' 'numpy==1.26.0' 'seekpath==2.2.0' 'pytest==8.4.0' \
              > "$RUNNER_TEMP/consumer-constraints.txt"
          fi
          atst_wheels=("$RUNNER_TEMP"/atst-dist/*.whl)
          test "${#atst_wheels[@]}" -eq 1
          plugin_wheels=("$GITHUB_WORKSPACE"/candidate-dist/*.whl)
          test "${#plugin_wheels[@]}" -eq 1
          atst_url=$(python -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).as_uri())' "${atst_wheels[0]}")
          plugin_url=$(python -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).as_uri())' "${plugin_wheels[0]}")
          atst_sha=$(sha256sum "${atst_wheels[0]}")
          plugin_sha=$(sha256sum "${plugin_wheels[0]}")
          # Explicit hashes preserve archive provenance even with pip 23.0.1
          # bundled in Python 3.10's ensurepip; plain wheel paths do not.
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip install \
            -c "$RUNNER_TEMP/consumer-constraints.txt" \
            "atst-tools[test] @ ${atst_url}#sha256=${atst_sha%% *}" \
            "abacuslite @ ${plugin_url}#sha256=${plugin_sha%% *}"
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip check
      - name: Run and verify the full installed ATST consumer suite
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer-external/bin/python" \
            "$GITHUB_WORKSPACE/consumer-sources/atst/scripts/run_abacuslite_consumer.py" \
            --atst-root "$GITHUB_WORKSPACE/consumer-sources/atst" \
            --backend external --report "$RUNNER_TEMP/external-consumer.json"
          "$RUNNER_TEMP/consumer-external/bin/python" \
            "$GITHUB_WORKSPACE/consumer-sources/atst/scripts/run_abacuslite_consumer.py" \
            --verify-report "$RUNNER_TEMP/external-consumer.json"
      - name: Install Forge with the same dependency constraints
        run: |
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip install \
            -c "$RUNNER_TEMP/consumer-constraints.txt" ./consumer-sources/forge
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip check
          "$RUNNER_TEMP/consumer-external/bin/python" -m pip freeze \
            > "$RUNNER_TEMP/consumer-freeze.txt"
      - name: Run every plugin-owned ATST and Forge contract outside checkouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/abacuslite-consumers"
          cp -R tests "$RUNNER_TEMP/abacuslite-consumers/tests"
          cp pyproject.toml "$RUNNER_TEMP/abacuslite-consumers/pyproject.toml"
          cd "$RUNNER_TEMP/abacuslite-consumers"
          "$RUNNER_TEMP/consumer-external/bin/python" -m pytest tests/consumers \
            --run-consumers -q -s --junitxml="$RUNNER_TEMP/plugin-consumers.pytest.xml" \
            > "$RUNNER_TEMP/plugin-consumers.pytest.log" 2>&1
          cat "$RUNNER_TEMP/plugin-consumers.pytest.log"
          python "$GITHUB_WORKSPACE/.github/scripts/check_consumer_results.py" \
            --junit "$RUNNER_TEMP/plugin-consumers.pytest.xml" \
            --expected "$GITHUB_WORKSPACE/.github/consumer-cases.json"
      - name: Upload installed consumer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-consumers-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/external-consumer.json
            ${{ runner.temp }}/external-consumer.pytest.log
            ${{ runner.temp }}/external-consumer.pytest.xml
            ${{ runner.temp }}/consumer-freeze.txt
            ${{ runner.temp }}/consumer-constraints.txt
            ${{ runner.temp }}/plugin-consumers.pytest.log
            ${{ runner.temp }}/plugin-consumers.pytest.xml
          if-no-files-found: warn

  resolve-engine-refs:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
      engine_repository: ${{ steps.refs.outputs.engine_repository }}
      harness_repository: ${{ steps.refs.outputs.harness_repository }}
      harness_ref: ${{ steps.refs.outputs.harness_ref }}
      assets_repository: ${{ steps.refs.outputs.assets_repository }}
      assets_ref: ${{ steps.refs.outputs.assets_ref }}
      assets_directory: ${{ steps.refs.outputs.assets_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the engine, harness and asset tuple once
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEVELOP_REF: ${{ inputs.develop_ref }}
          LTS_REF: ${{ inputs.lts_ref }}
          HARNESS_REF: ${{ inputs.harness_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/engine_refs.py --manifest tests/engine-refs.json \
            --event "$EVENT_NAME" --develop-ref "$DEVELOP_REF" \
            --lts-ref "$LTS_REF" --harness-ref "$HARNESS_REF" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/engine-refs.json"
          cat "$RUNNER_TEMP/engine-refs.json"
          cat "$RUNNER_TEMP/engine-refs.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-engine-refs
          path: ${{ runner.temp }}/engine-refs.json

  engine-compatibility:
    name: engine-compatibility (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [installed-package, resolve-engine-refs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-engine-refs.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions-3.12
          path: candidate-dist
      - name: Checkout the resolved engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-engine-refs.outputs.engine_repository }}
          ref: ${{ matrix.ref }}
          path: engine-source
          persist-credentials: false
      - name: Checkout the reviewed shared harness
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-engine-refs.outputs.harness_repository }}
          ref: ${{ needs.resolve-engine-refs.outputs.harness_ref }}
          path: engine-harness
          persist-credentials: false
      - name: Checkout curated common assets
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-engine-refs.outputs.assets_repository }}
          ref: ${{ needs.resolve-engine-refs.outputs.assets_ref }}
          path: engine-assets
          sparse-checkout: ${{ needs.resolve-engine-refs.outputs.assets_directory }}
          persist-credentials: false
      - name: Install the ordinary hosted CPU build dependencies
        run: bash scripts/ci/install_abacus_build_deps.sh
      - name: Cold-build this lane's resolved engine
        env:
          ENGINE_VARIANT: ${{ matrix.variant }}
          ENGINE_REF: ${{ matrix.ref }}
        run: |
          bash scripts/ci/build_abacus.sh --variant "$ENGINE_VARIANT" \
            --source-dir "$GITHUB_WORKSPACE/engine-source" \
            --build-dir "$RUNNER_TEMP/engine-build" \
            --report-dir "$RUNNER_TEMP/engine-reports/build" \
            --expected-sha "$ENGINE_REF"
      - name: Install the current plugin wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/engine-env"
          "$RUNNER_TEMP/engine-env/bin/python" -m pip install candidate-dist/*.whl 'pytest>=8,<10'
          "$RUNNER_TEMP/engine-env/bin/python" -m pip check
      - name: Verify assets and execute every required real-engine case
        env:
          ENGINE_REF: ${{ matrix.ref }}
          ENGINE_FORMAT: ${{ matrix.format }}
          ASSETS_DIRECTORY: ${{ needs.resolve-engine-refs.outputs.assets_directory }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/engine_refs.py --manifest tests/engine-refs.json \
            --assets-dir "$GITHUB_WORKSPACE/engine-assets/$ASSETS_DIRECTORY"
          engine=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["binary"]["path"])' \
            "$RUNNER_TEMP/engine-reports/build/build-provenance.json")
          wheels=("$GITHUB_WORKSPACE"/candidate-dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python engine-harness/interfaces/ASE_interface/tests/run_engine_compatibility.py \
            --engine "$engine" --mpi-command 'mpirun -np 2' \
            --assets "$GITHUB_WORKSPACE/engine-assets/$ASSETS_DIRECTORY" \
            --format "$ENGINE_FORMAT" --wheel "${wheels[0]}" \
            --report-dir "$RUNNER_TEMP/engine-reports/runtime" \
            --engine-ref "$ENGINE_REF" --python "$RUNNER_TEMP/engine-env/bin/python"
      - name: Retain engine build, provenance and raw runtime outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-compatibility-${{ matrix.variant }}
          path: ${{ runner.temp }}/engine-reports/
          if-no-files-found: warn

  compatibility-gate:
    name: compatibility-gate
    if: always()
    needs: [installed-package, installed-consumers, resolve-engine-refs, engine-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility job to succeed
        env:
          PACKAGE_RESULT: ${{ needs.installed-package.result }}
          CONSUMER_RESULT: ${{ needs.installed-consumers.result }}
          ENGINE_REFS_RESULT: ${{ needs.resolve-engine-refs.result }}
          ENGINE_RESULT: ${{ needs.engine-compatibility.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$CONSUMER_RESULT" = success
          test "$ENGINE_REFS_RESULT" = success
          test "$ENGINE_RESULT" = success
