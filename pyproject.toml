[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abacuslite"
version = "1.2.1"
description = "A lightweight ABACUS calculator and I/O plugin for ASE"
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Yuyang Ji" },
    { name = "Zhenxiong Shen" },
    { name = "Yike Huang" },
    { name = "Zhaoqing Liu" }
]
requires-python = ">=3.10"
dependencies = [
    "ase>=3.28,<4",
    "numpy>=1.26,<3",
    "seekpath>=2.2,<3"
]

[project.urls]
Homepage = "https://github.com/QuantumMisaka/abacuslite"
Documentation = "https://github.com/QuantumMisaka/abacuslite/tree/main/docs"
Issues = "https://github.com/QuantumMisaka/abacuslite/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2", "twine>=6"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["abacuslite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "engine: requires explicitly supplied ABACUS executable and assets",
    "consumer: requires explicitly installed external consumer packages"
]
